<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana de Preparación del estado 2859</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0F080A; /* Carbón oscuro con matiz carmesí */
      color: #FFF0F2;            /* Blanco escarcha rosado */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Tarjeta principal */
    .card-modal {
      background-color: #1A0D11; /* Pizarra granate profundo */
      border: 1px solid #33151D;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.85);
    }

    /* Barra superior con gradiente Carmesí / Rubí */
    .top-gradient-bar {
      height: 4px;
      background: linear-gradient(90deg, #E31A21 0%, #D61948 60%, transparent 100%);
    }

    /* Inputs y desplegables */
    .input-box {
      background-color: #12090C;
      border: 1px solid #33151D;
      color: #FFF0F2;
      transition: all 0.2s ease;
    }
    .input-box:focus {
      outline: none;
      border-color: #E31A21;
      box-shadow: 0 0 0 2px rgba(227, 26, 33, 0.25);
    }

    /* Botones de alianzas */
    .badge-btn {
      background-color: #210F15;
      color: #C2A1A8;
      border: 1px solid #3D1923;
      transition: all 0.2s ease;
    }
    .badge-btn:hover {
      background-color: #33151D;
      color: #FF4D6D;
      border-color: #E31A21;
    }
    .badge-selected {
      background-color: #E31A21 !important;
      color: #FFFFFF !important;
      font-weight: 700;
      border-color: #E31A21 !important;
    }

    /* Botón principal de envío */
    .btn-action {
      background: linear-gradient(90deg, #E31A21 0%, #D61948 100%);
      color: #FFFFFF;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .btn-action:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    /* Cajas contenedoras de iconos */
    .icon-box {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background-color: #14090D;
      border: 1px solid #33151D;
    }

    /* Opciones dentro de los selects */
    option {
      background-color: #12090C;
      color: #FFF0F2;
    }
    option:disabled {
      color: #63434B;
      background-color: #0A0406;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

  <div class="card-modal w-full max-w-3xl rounded-2xl overflow-hidden relative">
    <div class="top-gradient-bar"></div>

    <!-- Barra de 11 Idiomas -->
    <div class="flex justify-between items-center px-6 pt-5 pb-2">
      <div class="flex items-center gap-1 bg-[#12090C] p-1.5 rounded-lg border border-[#33151D] flex-wrap">
        <button type="button" onclick="setLanguage('es')" id="lang-es" class="px-2 py-1 text-xs rounded font-bold transition bg-[#E31A21] text-white">🇪🇸 ES</button>
        <button type="button" onclick="setLanguage('en')" id="lang-en" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇬🇧 EN</button>
        <button type="button" onclick="setLanguage('fr')" id="lang-fr" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇫🇷 FR</button>
        <button type="button" onclick="setLanguage('de')" id="lang-de" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇩🇪 DE</button>
        <button type="button" onclick="setLanguage('ru')" id="lang-ru" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇷🇺 RU</button>
        <button type="button" onclick="setLanguage('ko')" id="lang-ko" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇰🇷 KO</button>
        <button type="button" onclick="setLanguage('pl')" id="lang-pl" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇵🇱 PL</button>
        <button type="button" onclick="setLanguage('id')" id="lang-id" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇮🇩 ID</button>
        <button type="button" onclick="setLanguage('zh')" id="lang-zh" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇨🇳 中文</button>
        <button type="button" onclick="setLanguage('tr')" id="lang-tr" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇹🇷 TR</button>
        <button type="button" onclick="setLanguage('ar')" id="lang-ar" class="px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white">🇸🇦 AR</button>
      </div>
      <div class="w-7 h-7 rounded-full bg-[#12090C] flex items-center justify-center text-[#A88B92] text-xs">✕</div>
    </div>

    <!-- Pantalla de Convocatoria Cerrada -->
    <div id="closedNotice" class="p-10 text-center hidden">
      <div class="text-5xl mb-4">🔒</div>
      <h2 id="t-closedTitle" class="text-xl font-bold text-[#FFF0F2] mb-2">Convocatoria Cerrada</h2>
      <p id="t-closedDesc" class="text-[#A88B92] text-sm max-w-md mx-auto">El plazo de inscripción ha finalizado o aún no se encuentra abierto. Las asignaciones de horarios se publicarán pronto.</p>
    </div>

    <!-- Contenido del Formulario -->
    <div id="formContainer" class="px-6 pb-6 pt-2">
      <h1 id="t-title" class="text-xl sm:text-2xl font-bold text-center mb-5 text-[#FFF0F2] tracking-wide">Semana de Preparación del estado 2859</h1>

      <form id="savingsForm" class="space-y-5">
        
        <!-- Nombre Jugador e ID separados (Obligatorios) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label id="t-userName" class="block text-[11px] uppercase tracking-wider text-[#C2A1A8] font-semibold mb-1.5">User Name <span class="text-[#E31A21]">*</span></label>
            <input type="text" id="jugador" required placeholder="Tu Nick exacto" class="w-full input-box rounded-xl px-4 py-2.5 text-sm transition">
          </div>
          <div>
            <label id="t-userId" class="block text-[11px] uppercase tracking-wider text-[#C2A1A8] font-semibold mb-1.5">ID (Needs to be copy and paste) <span class="text-[#E31A21]">*</span></label>
            <input type="text" id="jugadorId" required placeholder="Pega tu ID aquí" class="w-full input-box rounded-xl px-4 py-2.5 text-sm transition">
          </div>
        </div>

        <!-- Alianzas (Obligatorio) -->
        <div>
          <label id="t-alliance" class="block text-[11px] uppercase tracking-wider text-[#C2A1A8] font-semibold mb-1.5 text-center">Alianza <span class="text-[#E31A21]">*</span></label>
          <div class="flex flex-wrap justify-center gap-2" id="allianceContainer">
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="COH">COH</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="GYM">GYM</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="TMX">TMX</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="PHO">PHO</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="BIG">BIG</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="WTF">WTF</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="OTHER">OTHER</button>
          </div>
        </div>

        <!-- Recursos por Intervalos (Opcionales) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
          <div>
            <label id="t-fireCrystal" class="block text-[10px] tracking-wider text-[#C2A1A8] font-bold mb-1.5 uppercase text-center">Cristal de Fuego</label>
            <div class="flex items-center gap-2">
              <div class="icon-box">
                <img src="img/cristal.png" alt="Cristal" onerror="this.outerHTML='<span>🔥</span>'" class="w-7 h-7 object-contain">
              </div>
              <select id="cristalFuego" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
            </div>
          </div>

          <div>
            <label id="t-refined" class="block text-[10px] tracking-wider text-[#C2A1A8] font-bold mb-1.5 uppercase text-center">Cristal de Fuego Refinado</label>
            <div class="flex items-center gap-2">
              <div class="icon-box">
                <img src="img/refinado.png" alt="Refinado" onerror="this.outerHTML='<span>💎</span>'" class="w-7 h-7 object-contain">
              </div>
              <select id="refinado" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
            </div>
          </div>

          <div>
            <label id="t-fragments" class="block text-[10px] tracking-wider text-[#C2A1A8] font-bold mb-1.5 uppercase text-center">Fragmentos</label>
            <div class="flex items-center gap-2">
              <div class="icon-box">
                <img src="img/fragmentos.png" alt="Fragmentos" onerror="this.outerHTML='<span>🔺</span>'" class="w-7 h-7 object-contain">
              </div>
              <select id="fragmentos" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
            </div>
          </div>
        </div>

        <!-- Aceleradores por Intervalos (Opcionales) -->
        <div class="pt-2">
          <p id="t-speedupsHeader" class="text-[11px] font-bold text-center tracking-wider text-[#C2A1A8] uppercase mb-3">Aceleradores (Días)</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label id="t-general" class="block text-[10px] uppercase text-[#C2A1A8] font-semibold mb-1">General</label>
              <div class="flex items-center gap-2">
                <div class="icon-box">
                  <img src="img/acel_general.png" alt="General" onerror="this.outerHTML='<span>⏩</span>'" class="w-7 h-7 object-contain">
                </div>
                <select id="acelGeneral" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
              </div>
            </div>

            <div>
              <label id="t-training" class="block text-[10px] uppercase text-[#C2A1A8] font-semibold mb-1">Entrenamiento</label>
              <div class="flex items-center gap-2">
                <div class="icon-box">
                  <img src="img/acel_entrenamiento.png" alt="Entrenamiento" onerror="this.outerHTML='<span>⚔️</span>'" class="w-7 h-7 object-contain">
                </div>
                <select id="acelEntrenamiento" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
              </div>
            </div>

            <div>
              <label id="t-construction" class="block text-[10px] uppercase text-[#C2A1A8] font-semibold mb-1">Construcción</label>
              <div class="flex items-center gap-2">
                <div class="icon-box">
                  <img src="img/acel_construccion.png" alt="Construcción" onerror="this.outerHTML='<span>🔨</span>'" class="w-7 h-7 object-contain">
                </div>
                <select id="acelConstruccion" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
              </div>
            </div>

            <div>
              <label id="t-research" class="block text-[10px] uppercase text-[#C2A1A8] font-semibold mb-1">Investigación</label>
              <div class="flex items-center gap-2">
                <div class="icon-box">
                  <img src="img/acel_investigacion.png" alt="Investigación" onerror="this.outerHTML='<span>🔬</span>'" class="w-7 h-7 object-contain">
                </div>
                <select id="acelInvestigacion" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
              </div>
            </div>
          </div>
        </div>

        <!-- 3 Prioridades por Día (Obligatorios) -->
        <div class="pt-2 border-t border-[#33151D]">
          <p id="t-scheduleHeader" class="text-[11px] font-bold text-center tracking-wider text-[#C2A1A8] uppercase mb-2">Inscripción por Prioridades (3 opciones por día) <span class="text-[#E31A21]">*</span></p>
          
          <div class="flex items-center justify-center gap-2 mb-4">
            <input type="checkbox" id="syncSchedule" class="rounded accent-[#E31A21] w-4 h-4 cursor-pointer">
            <label for="syncSchedule" id="t-syncLabel" class="text-xs text-[#FF6B8B] font-medium cursor-pointer">Aplicar las 3 opciones del Lunes a todos los días</label>
          </div>

          <!-- Lunes -->
          <div class="mb-4 bg-[#12090C] p-3 rounded-xl border border-[#33151D]">
            <label id="t-mon" class="block text-xs uppercase text-[#FF6B8B] font-bold mb-2">Lunes (Construcción) <span class="text-[#E31A21]">*</span></label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select id="lunesP1" required class="input-box rounded-lg p-2 text-xs"></select>
              <select id="lunesP2" required class="input-box rounded-lg p-2 text-xs"></select>
              <select id="lunesP3" required class="input-box rounded-lg p-2 text-xs"></select>
            </div>
          </div>

          <!-- Martes -->
          <div class="mb-4 bg-[#12090C] p-3 rounded-xl border border-[#33151D]">
            <label id="t-tue" class="block text-xs uppercase text-[#FF6B8B] font-bold mb-2">Martes (Investigación) <span class="text-[#E31A21]">*</span></label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select id="martesP1" required class="input-box rounded-lg p-2 text-xs"></select>
              <select id="martesP2" required class="input-box rounded-lg p-2 text-xs"></select>
              <select id="martesP3" required class="input-box rounded-lg p-2 text-xs"></select>
            </div>
          </div>

          <!-- Jueves -->
          <div class="bg-[#12090C] p-3 rounded-xl border border-[#33151D]">
            <label id="t-thu" class="block text-xs uppercase text-[#FF6B8B] font-bold mb-2">Jueves (Entrenamiento) <span class="text-[#E31A21]">*</span></label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select id="juevesP1" required class="input-box rounded-lg p-2 text-xs"></select>
              <select id="juevesP2" required class="input-box rounded-lg p-2 text-xs"></select>
              <select id="juevesP3" required class="input-box rounded-lg p-2 text-xs"></select>
            </div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-action w-full py-3.5 mt-4 rounded-xl font-bold shadow-lg cursor-pointer">
          Reserva tu hueco
        </button>

        <p id="msgStatus" class="text-center text-xs font-semibold hidden"></p>
      </form>
    </div>
  </div>

    let currentLang = "es";

    function safeSetText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function safeSetPlaceholder(id, text) {
      const el = document.getElementById(id);
      if (el) el.placeholder = text;
    }

    function populateResourceSelectors() {
      const t = translations[currentLang] || translations.es;

      const cfRanges = [
        { v: "0-500", l: "0 - 500" }, { v: "501-1000", l: "501 - 1000" },
        { v: "1001-1500", l: "1001 - 1500" }, { v: "1501-2000", l: "1501 - 2000" },
        { v: "2001-2500", l: "2001 - 2500" }, { v: "2501-3000", l: "2501 - 3000" },
        { v: "+3001", l: "+3001" }, { v: "Ilimitado", l: t.unlimited }
      ];

      const refRanges = [
        { v: "0-20", l: "0 - 20" }, { v: "21-50", l: "21 - 50" },
        { v: "51-80", l: "51 - 80" }, { v: "81-110", l: "81 - 110" },
        { v: "111-130", l: "111 - 130" }, { v: "131-160", l: "131 - 160" },
        { v: "+161", l: "+161" }, { v: "Ilimitado", l: t.unlimited }
      ];

      const fragRanges = [
        { v: "0-250", l: "0 - 250" }, { v: "251-500", l: "251 - 500" },
        { v: "501-1000", l: "501 - 1000" }, { v: "1001-1500", l: "1001 - 1500" },
        { v: "1501-2000", l: "1501 - 2000" }, { v: "+2001", l: "+2001" },
        { v: "Ilimitado", l: t.unlimited }
      ];

      const spdRanges = [
        { v: "0-29", l: `0 - 29 ${t.dayUnit}` }, { v: "30-40", l: `30 - 40 ${t.dayUnit}` },
        { v: "41-59", l: `41 - 59 ${t.dayUnit}` }, { v: "+60", l: `+60 ${t.dayUnit}` },
        { v: "+100", l: `+100 ${t.dayUnit}` }, { v: "Ilimitado", l: t.unlimited }
      ];

      fillSelect("cristalFuego", cfRanges);
      fillSelect("refinado", refRanges);
      fillSelect("fragmentos", fragRanges);
      fillSelect("acelGeneral", spdRanges);
      fillSelect("acelEntrenamiento", spdRanges);
      fillSelect("acelConstruccion", spdRanges);
      fillSelect("acelInvestigacion", spdRanges);
    }

    function fillSelect(id, list) {
      const el = document.getElementById(id);
      if (!el) return;
      const prev = el.value;
      el.innerHTML = list.map(item => `<option value="${item.v}">${item.l}</option>`).join('');
      if (prev) el.value = prev;
    }

    function populateTimeSelectors() {
      const t = translations[currentLang] || translations.es;
      const selectors = [
        { id: "lunesP1", label: t.p1 }, { id: "lunesP2", label: t.p2 }, { id: "lunesP3", label: t.p3 },
        { id: "martesP1", label: t.p1 }, { id: "martesP2", label: t.p2 }, { id: "martesP3", label: t.p3 },
        { id: "juevesP1", label: t.p1 }, { id: "juevesP2", label: t.p2 }, { id: "juevesP3", label: t.p3 }
      ];

      selectors.forEach(({ id, label }) => {
        const el = document.getElementById(id);
        if (!el) return;
        const currentVal = el.value || "No participa";
        let html = `<option value="No participa">${t.noParticipate}</option>`;

        for (let h = 0; h < 24; h++) {
          for (let m = 0; m < 60; m += 30) {
            const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            html += `<option value="${timeStr}">${label}${timeStr}</option>`;
          }
        }
        el.innerHTML = html;
        el.value = currentVal;
      });
    }

    function checkConvocatoria() {
      if (!SCRIPT_URL || SCRIPT_URL.includes("...")) return;
      const script = document.createElement("script");
      const cbName = "onCheckStatus_" + Math.floor(Math.random() * 1000000);

      window[cbName] = function(data) {
        if (data && data.estado === "CERRADO") {
          document.getElementById("formContainer").classList.add("hidden");
          document.getElementById("closedNotice").classList.remove("hidden");
        } else {
          document.getElementById("formContainer").classList.remove("hidden");
          document.getElementById("closedNotice").classList.add("hidden");
        }
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      script.src = SCRIPT_URL + (SCRIPT_URL.includes("?") ? "&" : "?") + "callback=" + cbName + "&t=" + Date.now();
      document.body.appendChild(script);
    }

    function setLanguage(lang) {
      if (!translations[lang]) return;
      currentLang = lang;
      const t = translations[lang];

      safeSetText("t-title", t.title);
      safeSetText("t-userName", t.userName);
      safeSetPlaceholder("jugador", t.userPlaceholder);
      safeSetText("t-userId", t.userId);
      safeSetPlaceholder("jugadorId", t.idPlaceholder);
      safeSetText("t-alliance", t.allianceLabel);
      safeSetText("t-fireCrystal", t.fireCrystal);
      safeSetText("t-refined", t.refined);
      safeSetText("t-fragments", t.fragments);
      safeSetText("t-speedupsHeader", t.speedupsHeader);
      safeSetText("t-general", t.general);
      safeSetText("t-training", t.training);
      safeSetText("t-construction", t.construction);
      safeSetText("t-research", t.research);
      safeSetText("t-scheduleHeader", t.scheduleHeader);
      safeSetText("t-syncLabel", t.syncLabel);
      safeSetText("t-mon", t.mon);
      safeSetText("t-tue", t.tue);
      safeSetText("t-thu", t.thu);
      safeSetText("submitBtn", t.submit);
      safeSetText("t-closedTitle", t.closedTitle);
      safeSetText("t-closedDesc", t.closedDesc);

      ["es", "en", "fr", "de", "ru", "ko", "pl", "id", "zh", "tr", "ar"].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if (btn) {
          btn.className = (l === lang) 
            ? "px-2 py-1 text-xs rounded font-bold transition bg-[#E31A21] text-white" 
            : "px-2 py-1 text-xs rounded font-bold transition text-[#A88B92] hover:text-white";
        }
      });

      populateResourceSelectors();
      populateTimeSelectors();
    }

    function syncAllDays() {
      const p1 = document.getElementById("lunesP1").value;
      const p2 = document.getElementById("lunesP2").value;
      const p3 = document.getElementById("lunesP3").value;

      ["martes", "jueves"].forEach(dia => {
        document.getElementById(`${dia}P1`).value = p1;
        document.getElementById(`${dia}P2`).value = p2;
        document.getElementById(`${dia}P3`).value = p3;
      });
    }

    ["lunesP1", "lunesP2", "lunesP3"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => {
        if (document.getElementById("syncSchedule").checked) syncAllDays();
      });
    });

    document.getElementById("syncSchedule").addEventListener("change", (e) => {
      if (e.target.checked) syncAllDays();
    });

    let selectedAlliance = "";
    document.querySelectorAll(".alliance-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".alliance-btn").forEach(b => b.classList.remove("badge-selected"));
        btn.classList.add("badge-selected");
        selectedAlliance = btn.getAttribute("data-val");
      });
    });

    document.getElementById("savingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = translations[currentLang] || translations.es;

      const jugador = document.getElementById("jugador").value.trim();
      const jugadorId = document.getElementById("jugadorId").value.trim();

      // Validación de campos estrictamente obligatorios
      if (!jugador || !jugadorId) {
        alert(t.alertRequired);
        return;
      }

      if (!selectedAlliance) {
        alert(t.alertAlliance);
        return;
      }

      // Verificación de que las 9 opciones de prioridad horaria estén seleccionadas
      const scheduleSelectors = [
        "lunesP1", "lunesP2", "lunesP3",
        "martesP1", "martesP2", "martesP3",
        "juevesP1", "juevesP2", "juevesP3"
      ];
      const allScheduleFilled = scheduleSelectors.every(id => {
        const val = document.getElementById(id).value;
        return val && val !== "";
      });

      if (!allScheduleFilled) {
        alert(t.alertSchedule);
        return;
      }

      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("msgStatus");

      btn.disabled = true;
      btn.textContent = t.sending;

      const payload = {
        jugador: jugador,
        jugadorId: jugadorId,
        alianza: selectedAlliance,
        cristalFuego: document.getElementById("cristalFuego").value || "0-500",
        refinado: document.getElementById("refinado").value || "0-20",
        fragmentos: document.getElementById("fragmentos").value || "0-250",
        acelGeneral: document.getElementById("acelGeneral").value || "0-29",
        acelEntrenamiento: document.getElementById("acelEntrenamiento").value || "0-29",
        acelConstruccion: document.getElementById("acelConstruccion").value || "0-29",
        acelInvestigacion: document.getElementById("acelInvestigacion").value || "0-29",
        horaLunesP1: document.getElementById("lunesP1").value,
        horaLunesP2: document.getElementById("lunesP2").value,
        horaLunesP3: document.getElementById("lunesP3").value,
        horaMartesP1: document.getElementById("martesP1").value,
        horaMartesP2: document.getElementById("martesP2").value,
        horaMartesP3: document.getElementById("martesP3").value,
        horaJuevesP1: document.getElementById("juevesP1").value,
        horaJuevesP2: document.getElementById("juevesP2").value,
        horaJuevesP3: document.getElementById("juevesP3").value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        msg.textContent = t.success;
        msg.className = "text-center text-xs font-semibold text-[#FF4D6D] block";
        document.getElementById("savingsForm").reset();
        document.querySelectorAll(".badge-selected").forEach(b => b.classList.remove("badge-selected"));
        selectedAlliance = "";
      } catch (err) {
        msg.textContent = t.error;
        msg.className = "text-center text-xs font-semibold text-rose-400 block";
      } finally {
        btn.disabled = false;
        btn.textContent = t.submit;
      }
    });

    populateResourceSelectors();
    populateTimeSelectors();
    checkConvocatoria();
  </script>
